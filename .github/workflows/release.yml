name: release-artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: yoskeoka/ai-arena
          ref: 212839f537274d8874a2e29afc2bb292cd842dd0
          path: ai-arena
      - run: tools/release-packager/fetch-xot.sh .tmp/xot
      - run: XOT_OPENINGS_DIR="$PWD/.tmp/xot" AI_ARENA_DIR="$PWD/ai-arena" RELEASE_VERSION="$GITHUB_REF_NAME" make verify-release-artifacts
